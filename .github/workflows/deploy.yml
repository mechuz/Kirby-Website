name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    # Rebuild daily at 11:30 UTC (~5:30am Memphis) so suite availability
    # on /rates-floor-plans/ stays in sync with DoorLoop.
    - cron: '30 11 * * *'
    # Every 30 minutes, so /news/ and the home page pick up new senior living
    # headlines from the publishers' RSS feeds soon after they are posted.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs (GitHub's recommended layout for Pages).
  # deploy-pages occasionally failed with "No artifacts named github-pages were
  # found" when it ran in the same job a fraction of a second after the upload,
  # before the artifact was listed by the API (Nov 15, 19, 20, 21 and 22).
  # The job boundary gives the artifact time to register, and the deploy step
  # retries once after a short wait if the lookup still comes back empty.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the latest senior living headlines
        continue-on-error: true
        run: python3 scripts/fetch_news_feeds.py
      - name: Build site
        env:
          # Fourthwall storefront token for the /merch/ product grid. Optional:
          # without it the page shows the cached catalog or "launching soon".
          FOURTHWALL_STOREFRONT_TOKEN: ${{ secrets.FOURTHWALL_STOREFRONT_TOKEN }}
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
